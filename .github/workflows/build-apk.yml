name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Ensure Android Variables File Exists
        run: |
          if [ ! -f android/variables.gradle ]; then
            echo "Creating fallback android/variables.gradle..."
            cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 36
              targetSdkVersion = 36
              androidxActivityVersion = '1.11.0'
              androidxAppCompatVersion = '1.7.1'
              androidxCoordinatorLayoutVersion = '1.3.0'
              androidxCoreVersion = '1.17.0'
              androidxFragmentVersion = '1.8.9'
              coreSplashScreenVersion = '1.2.0'
              androidxWebkitVersion = '1.14.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.3.0'
              androidxEspressoCoreVersion = '3.7.0'
              cordovaAndroidVersion = '14.0.1'
          }
          EOF
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransVid-IA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
